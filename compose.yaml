services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab6}
      POSTGRES_USER: ${POSTGRES_USER:-lab6}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab6-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab6} -d ${POSTGRES_DB:-lab6}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
